name: CI Pipeline

on:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # IMPORTANT FIX
      - run: npm install --include=dev

      - run: npx htmlhint "src/*.html"

      - run: npx stylelint "styles/style.css"

      # REAL FIX HERE
      - run: npx parcel build src/index.html --dist-dir dist --no-cache --log-level verbose