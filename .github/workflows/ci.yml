name: CI Pipeline

on:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # install everything safely
      - run: npm install

      # confirm parcel exists
      - run: npx parcel --version

      # HTML check
      - run: npx htmlhint "src/*.html"

      # CSS check
      - run: npx stylelint "styles/style.css"

      # build WITHOUT npm script dependency
      - run: npx parcel build src/index.html --dist-dir dist