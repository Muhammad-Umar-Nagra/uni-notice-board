name: CI Pipeline

on:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # clean install (important)
      - run: npm ci

      # verify install
      - run: npx parcel --version

      # lint
      - run: npx htmlhint "src/*.html"
      - run: npx stylelint "styles/style.css"

      # build (most stable way)
      - run: npx parcel build src/index.html --dist-dir dist