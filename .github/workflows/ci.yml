name: CI Pipeline

on:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install dependencies FIRST (very important)
      - run: npm install

      # Debug step (helps if build fails)
      - run: npm list parcel

      # Lint checks
      - run: npx htmlhint "src/*.html"
      - run: npx stylelint "styles/style.css"

      # Build step
      - run: npx parcel build src/index.html --dist-dir dist